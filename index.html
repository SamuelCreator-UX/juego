
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>🐉 DRAGON RUN</h1>
    <p>Presiona ESPACIO o ↑ para saltar</p>

    <div class="stats">
      <span id="score">Puntos: 0</span>
      <span id="best">Récord: 0</span>
    </div>

    <canvas id="game" width="800" height="300"></canvas>

    <button id="restart">Jugar de nuevo</button>
    <p class="help">También puedes tocar la pantalla para saltar.</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
